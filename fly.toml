# Deploy: fly launch (first time) or fly deploy
# Secrets: fly secrets set STUDIO_USER=... STUDIO_PASSWORD=...
# Volume: created on first launch / see README

app = "nutriklub-studio"
primary_region = "arn"

[build]

[env]
  STUDIO_HOST = "0.0.0.0"
  STUDIO_PORT = "8000"
  STUDIO_DATA = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[mounts]]
  source = "studio_data"
  destination = "/data"
  initial_size = "1gb"

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
